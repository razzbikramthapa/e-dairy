      .bg { fill: #523B8B; }
      .gold { fill: #FFB11A; }
      .white { fill: #FFFFFF; }
      .text-main { font-family: 'Outfit', 'Inter', 'Segoe UI', sans-serif; font-size: 72px; font-weight: 400; fill: #FFFFFF; text-anchor: middle; letter-spacing: 2px; }
      .text-sub { font-family: 'Inter', 'Segoe UI', sans-serif; font-size: 10px; font-weight: 600; fill: #FFB11A; text-anchor: middle; letter-spacing: 4px; }
    </style>
  </defs>
  
  <!-- Purple background -->
  <rect width="500" height="400" rx="16" class="bg"/>
  
  <!-- Dairy Emblem / Udder-like crown above cow -->
