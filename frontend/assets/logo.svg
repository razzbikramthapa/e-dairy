  <circle cx="232" cy="74" r="8" class="gold" />
  <circle cx="268" cy="74" r="8" class="gold" />
  
  <!-- Cow Silhouette (walking to the right) -->
  <path d="M 185,190 
           C 185,150 200,140 230,140 
           L 290,140 
           C 305,140 310,135 315,128 
           L 320,135
           C 324,131 328,127 325,120
           C 328,122 331,125 333,128 
           L 335,133
           C 338,135 339,139 338,143 
           L 332,150 
           C 328,155 328,160 328,165 
           L 324,175
           C 322,180 318,185 314,185
           L 305,185
           L 305,230
           C 305,242 295,242 295,230
           L 295,195
           L 282,195
           L 282,230
           C 282,242 272,242 272,230
           L 272,195
           L 225,195
           L 225,230
           C 225,242 215,242 215,230
           L 215,195
           L 202,195
           L 202,230
           C 202,242 192,242 192,230
           L 192,185
           C 188,185 186,188 185,190 Z" class="gold" />
           
  <!-- Cow Udder / Tail details -->
  <path d="M 235,195 Q 242,210 248,195" class="gold" stroke="#523B8B" stroke-width="2" />
  <!-- Cow tail -->
  <path d="M 188,155 Q 180,175 182,200 Q 183,205 180,205" fill="none" stroke="#FFB11A" stroke-width="4" stroke-linecap="round" />

  <!-- Main e-Dairy Text -->
  <text x="250" y="315" class="text-main">e-Dairy</text>
  
