<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <!-- Shadows & Gradients -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E152A" flood-opacity="0.12"/>
    </filter>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#523B8B"/>
      <stop offset="100%" stop-color="#2C1A52"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFC107"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FAF8FF"/>
      <stop offset="100%" stop-color="#F1ECFD"/>
    </linearGradient>
  </defs>

  <!-- BACKGROUND DESIGN ELEMENTS -->
  <!-- Abstract soft gold and purple decorative background blobs -->
  <circle cx="650" cy="220" r="140" fill="#FFB11A" opacity="0.07" />
  <rect x="50" y="250" width="120" height="120" rx="20" transform="rotate(25, 110, 310)" fill="#523B8B" opacity="0.06" />

  <!-- 1. DESKTOP MONITOR MOCKUP -->
  <g transform="translate(120, 40)" filter="url(#shadow)">
    <!-- Stand -->
    <path d="M 220,380 L 250,380 L 265,450 L 205,450 Z" fill="#D3CDE2"/>
    <ellipse cx="235" cy="450" rx="60" ry="12" fill="#B4AEC4"/>
    
    <!-- Monitor Bezel -->
    <rect x="10" y="10" width="450" height="370" rx="16" fill="#1E152A" stroke="#2C1A52" stroke-width="2"/>
    <rect x="15" y="15" width="440" height="350" rx="8" fill="#FFFFFF"/>
    
    <!-- Dashboard Screen Content -->
    <g transform="translate(15, 15)">
      <!-- Sidebar -->
      <rect x="0" y="0" width="80" height="350" rx="8" fill="url(#purpleGrad)"/>
      <!-- Sidebar Logo Icon -->
      <circle cx="40" cy="35" r="18" fill="#FFB11A" opacity="0.2"/>
      <path d="M 33,35 C 33,31 36,30 40,30 C 44,30 47,31 47,35 C 47,40 40,43 40,43 Z" fill="#FFB11A"/>
      <circle cx="40" cy="28" r="4" fill="#FFB11A"/>
      
      <!-- Sidebar Menu Items -->
      <rect x="15" y="80" width="50" height="6" rx="3" fill="#FFFFFF" opacity="0.8"/>
      <rect x="15" y="105" width="50" height="6" rx="3" fill="#FFFFFF" opacity="0.4"/>
      <rect x="15" y="130" width="50" height="6" rx="3" fill="#FFFFFF" opacity="0.4"/>
      <rect x="15" y="155" width="50" height="6" rx="3" fill="#FFFFFF" opacity="0.4"/>
      <rect x="15" y="180" width="50" height="6" rx="3" fill="#FFFFFF" opacity="0.4"/>
      <rect x="15" y="205" width="50" height="6" rx="3" fill="#FFFFFF" opacity="0.4"/>
      
      <!-- Main Panel Background -->
      <rect x="80" y="0" width="360" height="350" rx="8" fill="#F8F7FC"/>
      
      <!-- Header -->
      <rect x="95" y="15" width="330" height="40" rx="8" fill="#FFFFFF" filter="url(#shadow)" opacity="0.4"/>
      <text x="110" y="39" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#2C1A52">e-Dairy Dashboard</text>
      <circle cx="400" cy="35" r="12" fill="#523B8B" opacity="0.1"/>
      <circle cx="400" cy="32" r="4" fill="#523B8B"/>
      <path d="M 394,42 C 394,40 406,40 406,42 Z" fill="#523B8B"/>

      <!-- Statistics Widgets -->
      <!-- Widget 1: Milk Today -->
      <g transform="translate(95, 70)">
        <rect x="0" y="0" width="100" height="65" rx="8" fill="#FFFFFF" filter="url(#shadow)" opacity="0.5"/>
        <text x="10" y="18" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#7A7090">Total Milk (L)</text>
        <text x="10" y="42" font-family="'Outfit', sans-serif" font-size="18" font-weight="700" fill="#523B8B">1,248.5</text>
        <rect x="10" y="48" width="50" height="4" rx="2" fill="#523B8B" opacity="0.2"/>
        <rect x="10" y="48" width="35" height="4" rx="2" fill="#FFB11A"/>
      </g>
      
      <!-- Widget 2: Avg Fat -->
      <g transform="translate(210, 70)">
        <rect x="0" y="0" width="100" height="65" rx="8" fill="#FFFFFF" filter="url(#shadow)" opacity="0.5"/>
        <text x="10" y="18" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#7A7090">Avg Fat Content</text>
        <text x="10" y="42" font-family="'Outfit', sans-serif" font-size="18" font-weight="700" fill="#FFB11A">4.82%</text>
        <rect x="10" y="48" width="50" height="4" rx="2" fill="#FFB11A" opacity="0.2"/>
        <rect x="10" y="48" width="40" height="4" rx="2" fill="#FFB11A"/>
      </g>

      <!-- Widget 3: Active Members -->
      <g transform="translate(325, 70)">
        <rect x="0" y="0" width="100" height="65" rx="8" fill="#FFFFFF" filter="url(#shadow)" opacity="0.5"/>
        <text x="10" y="18" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#7A7090">Active Farmers</text>
        <text x="10" y="42" font-family="'Outfit', sans-serif" font-size="18" font-weight="700" fill="#2C1A52">184</text>
        <rect x="10" y="48" width="50" height="4" rx="2" fill="#2C1A52" opacity="0.2"/>
        <rect x="10" y="48" width="45" height="4" rx="2" fill="#523B8B"/>
      </g>

      <!-- Collection Table & Analytics Row -->
      <!-- Quality Chart Box -->
      <g transform="translate(95, 150)">
        <rect x="0" y="0" width="200" height="185" rx="10" fill="#FFFFFF" filter="url(#shadow)" opacity="0.7"/>
        <text x="15" y="22" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#2C1A52">Weekly Production (Litres)</text>
        
        <!-- Bar Chart Visual -->
        <!-- Gridlines -->
        <line x1="20" y1="140" x2="180" y2="140" stroke="#E6E2F0" stroke-width="1"/>
        <line x1="20" y1="100" x2="180" y2="100" stroke="#E6E2F0" stroke-dasharray="3,3"/>
        <line x1="20" y1="60" x2="180" y2="60" stroke="#E6E2F0" stroke-dasharray="3,3"/>
        
        <!-- Bars -->
        <!-- Sun -->
        <rect x="35" y="90" width="12" height="50" rx="3" fill="#523B8B" opacity="0.7"/>
        <!-- Mon -->
        <rect x="55" y="60" width="12" height="80" rx="3" fill="#FFB11A"/>
        <!-- Tue -->
        <rect x="75" y="50" width="12" height="90" rx="3" fill="#523B8B"/>
        <!-- Wed -->
        <rect x="95" y="70" width="12" height="70" rx="3" fill="#523B8B" opacity="0.7"/>
        <!-- Thu -->
        <rect x="115" y="40" width="12" height="100" rx="3" fill="#FFB11A"/>
        <!-- Fri -->
        <rect x="135" y="55" width="12" height="85" rx="3" fill="#523B8B"/>
        <!-- Sat -->
        <rect x="155" y="80" width="12" height="60" rx="3" fill="#523B8B" opacity="0.3"/>
      </g>

      <!-- Recent Milk Collections -->
      <g transform="translate(305, 150)">
        <rect x="0" y="0" width="120" height="185" rx="10" fill="#FFFFFF" filter="url(#shadow)" opacity="0.7"/>
        <text x="12" y="22" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#2C1A52">Live Records</text>
        
        <!-- Record Row 1 -->
        <g transform="translate(10, 38)">
          <circle cx="12" cy="12" r="12" fill="#523B8B" opacity="0.1"/>
          <!-- Milk can icon representation -->
          <rect x="9" y="6" width="6" height="11" rx="1" fill="#523B8B"/>
          <text x="30" y="11" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#2C1A52">#1024</text>
          <text x="30" y="20" font-family="'Inter', sans-serif" font-size="7" fill="#7A7090">Hari Lal - 24.5L</text>
        </g>
        
        <!-- Record Row 2 -->
        <g transform="translate(10, 72)">
          <circle cx="12" cy="12" r="12" fill="#FFB11A" opacity="0.1"/>
          <rect x="9" y="6" width="6" height="11" rx="1" fill="#FFB11A"/>
          <text x="30" y="11" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#2C1A52">#1025</text>
          <text x="30" y="20" font-family="'Inter', sans-serif" font-size="7" fill="#7A7090">Ram Dev - 42.0L</text>
        </g>

        <!-- Record Row 3 -->
        <g transform="translate(10, 106)">
          <circle cx="12" cy="12" r="12" fill="#523B8B" opacity="0.1"/>
          <rect x="9" y="6" width="6" height="11" rx="1" fill="#523B8B"/>
          <text x="30" y="11" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#2C1A52">#1026</text>
          <text x="30" y="20" font-family="'Inter', sans-serif" font-size="7" fill="#7A7090">Sita Shah - 18.2L</text>
        </g>
        
        <!-- Record Row 4 -->
        <g transform="translate(10, 140)">
          <circle cx="12" cy="12" r="12" fill="#523B8B" opacity="0.1"/>
          <rect x="9" y="6" width="6" height="11" rx="1" fill="#523B8B"/>
          <text x="30" y="11" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#2C1A52">#1027</text>
          <text x="30" y="20" font-family="'Inter', sans-serif" font-size="7" fill="#7A7090">Niranjan - 31.0L</text>
        </g>
      </g>
    </g>
  </g>

  <!-- 2. SMARTPHONE DEVICE MOCKUP -->
  <g transform="translate(500, 180)" filter="url(#shadow)">
    <!-- Phone Case -->
    <rect x="0" y="0" width="140" height="280" rx="22" fill="#1C1829" stroke="#372E4D" stroke-width="2.5"/>
    <!-- Screen -->
    <rect x="5" y="5" width="130" height="270" rx="18" fill="#FAF8FF"/>
    
    <!-- Camera Notch -->
    <rect x="40" y="5" width="60" height="12" rx="6" fill="#1C1829"/>
    
    <!-- Phone Screen Content -->
    <!-- App Header -->
    <g transform="translate(5, 17)">
      <rect x="0" y="0" width="130" height="28" fill="#523B8B"/>
      <!-- Small Logo representation -->
      <circle cx="20" cy="14" r="8" fill="#FFB11A"/>
      <text x="34" y="18" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">e-Dairy</text>
      <!-- Hamburger Menu -->
      <line x1="110" y1="11" x2="120" y2="11" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="110" y1="14" x2="120" y2="14" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="110" y1="17" x2="120" y2="17" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- App Body Content -->
    <g transform="translate(12, 55)">
      <!-- Main Greeting -->
      <text x="0" y="10" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#2C1A52">Quick Milk Add</text>
      <text x="0" y="18" font-family="'Inter', sans-serif" font-size="6" fill="#7A7090">Session: Evening Collection</text>
      
      <!-- Input Card Form Representation -->
      <g transform="translate(0, 24)">
        <rect x="0" y="0" width="116" height="100" rx="8" fill="#FFFFFF" filter="url(#shadow)" opacity="0.8"/>
        
        <!-- Farmer Select -->
        <text x="8" y="12" font-family="'Inter', sans-serif" font-size="6" font-weight="600" fill="#7A7090">Select Farmer</text>
        <rect x="8" y="16" width="100" height="14" rx="3" fill="#F3EEFD"/>
        <text x="12" y="25" font-family="'Inter', sans-serif" font-size="7" font-weight="700" fill="#523B8B">1025 - Ram Dev</text>
        <!-- Dropdown arrow -->
        <path d="M 100,22 L 103,25 L 106,22" fill="none" stroke="#523B8B" stroke-width="1"/>

        <!-- Quantity input -->
        <text x="8" y="42" font-family="'Inter', sans-serif" font-size="6" font-weight="600" fill="#7A7090">Quantity (Litres)</text>
        <rect x="8" y="46" width="46" height="14" rx="3" fill="#F8F7FC" stroke="#E6E2F0" stroke-width="0.5"/>
        <text x="12" y="55" font-family="'Outfit', sans-serif" font-size="8" font-weight="700" fill="#2C1A52">42.0</text>

        <!-- Fat % input -->
        <text x="62" y="42" font-family="'Inter', sans-serif" font-size="6" font-weight="600" fill="#7A7090">Fat / SNF %</text>
        <rect x="62" y="46" width="46" height="14" rx="3" fill="#F8F7FC" stroke="#E6E2F0" stroke-width="0.5"/>
        <text x="66" y="55" font-family="'Outfit', sans-serif" font-size="8" font-weight="700" fill="#FFB11A">4.8 / 8.5</text>

        <!-- Save Button -->
        <rect x="8" y="74" width="100" height="16" rx="4" fill="#523B8B"/>
        <text x="58" y="84" font-family="'Outfit', sans-serif" font-size="7" font-weight="700" fill="#FFFFFF" text-anchor="middle">SUBMIT RECORD</text>
      </g>
      
      <!-- Quick Dashboard Summary -->
      <g transform="translate(0, 136)">
        <rect x="0" y="0" width="116" height="50" rx="8" fill="#523B8B"/>
        <text x="10" y="14" font-family="'Outfit', sans-serif" font-size="8" font-weight="700" fill="#FFFFFF">Session Progress</text>
        <text x="10" y="30" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#FFB11A">584.2 L</text>
        <text x="10" y="40" font-family="'Inter', sans-serif" font-size="6" fill="#FFFFFF" opacity="0.7">Goal: 600.0 L (97%)</text>
        
        <!-- Mini Progress bar -->
        <rect x="75" y="24" width="30" height="4" rx="2" fill="#FFFFFF" opacity="0.3"/>
        <rect x="75" y="24" width="28" height="4" rx="2" fill="#FFB11A"/>
      </g>
      
      <!-- Success Banner -->
      <g transform="translate(0, 196)">
        <rect x="0" y="0" width="116" height="20" rx="4" fill="#4CAF50" opacity="0.15"/>
        <text x="18" y="12" font-family="'Inter', sans-serif" font-size="6" font-weight="700" fill="#388E3C">✓ Auto-synced to cloud</text>
        <circle cx="10" cy="10" r="3" fill="#388E3C"/>
      </g>
    </g>
    
    <!-- Home Bar -->
    <rect x="50" y="271" width="40" height="3" rx="1.5" fill="#1C1829" opacity="0.5"/>
  </g>
</svg>
